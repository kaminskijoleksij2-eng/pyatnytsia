<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>П'ятниця</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1119">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="П'ятниця">
<style>
  :root{
    --bg: #0d1119;
    --panel: #151b2b;
    --panel-2: #1c2338;
    --line: #262d42;
    --text: #eef0f7;
    --muted: #8890a8;
    --accent: #e3a94c;
    --accent-dim: #6b5527;
    --user-bubble: #232a40;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #1a2036 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  header{
    padding:22px 20px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .holo{
    width:52px;height:52px;
    position:relative;
    flex-shrink:0;
  }
  .holo .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid var(--accent-dim);
  }
  .holo .ring-outer{
    border-style:dashed;
    opacity:.55;
    animation:spin 7s linear infinite;
  }
  .holo .ring-mid{
    inset:9px;
    border-color:var(--accent);
    opacity:.4;
    animation:spin 4.5s linear infinite reverse;
  }
  .holo .core{
    position:absolute;
    inset:17px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f6d18a, var(--accent) 55%, var(--accent-dim) 100%);
    box-shadow:0 0 0 0 rgba(227,169,76,.5);
    transition:box-shadow .3s ease;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulseCore{
    0%{box-shadow:0 0 0 0 rgba(227,169,76,.5);}
    70%{box-shadow:0 0 0 15px rgba(227,169,76,0);}
    100%{box-shadow:0 0 0 0 rgba(227,169,76,0);}
  }
  .holo.listening .core{ animation:pulseCore 1.4s infinite; }
  .holo.speaking .core{ animation:pulseCore 0.55s infinite; }
  .holo.speaking .ring-outer{ animation-duration:2s; border-color:var(--accent); opacity:.8; }
  .holo.speaking .ring-mid{ animation-duration:1.1s; opacity:.7; }
  header h1{
    font-size:19px;
    font-weight:600;
    letter-spacing:.2px;
    margin:0;
  }
  header p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--muted);
  }
  header .headtext{ flex:1; min-width:0; }
  #voiceSelect{
    background:var(--panel);
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:12px;
    padding:6px 8px;
    max-width:112px;
    flex-shrink:0;
  }

  main{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:16px;
    font-size:15px;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .msg.model{
    background:var(--panel);
    border:1px solid var(--line);
    align-self:flex-start;
    border-bottom-left-radius:4px;
  }
  .msg.user{
    background:var(--user-bubble);
    align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  .msg.system{
    align-self:center;
    color:var(--muted);
    font-size:12.5px;
    background:none;
    padding:2px 8px;
  }

  footer{
    padding:12px 14px;
    border-top:1px solid var(--line);
    display:flex;
    gap:8px;
    align-items:flex-end;
    flex-shrink:0;
    background:var(--bg);
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:14px;
    padding:11px 14px;
    font-size:15px;
    font-family:inherit;
    max-height:120px;
    line-height:1.4;
  }
  textarea:focus{outline:none;border-color:var(--accent-dim);}

  button.round{
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:18px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  button.round.mic.on{
    background:var(--accent);
    color:#1a1206;
    border-color:var(--accent);
  }
  button.round.send{
    background:var(--accent);
    color:#1a1206;
    border-color:var(--accent);
  }
  button.round:active{transform:scale(0.94);}

  .hint{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:6px 20px 0;
  }

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>

<header>
  <div class="holo" id="holo">
    <div class="ring ring-outer"></div>
    <div class="ring ring-mid"></div>
    <div class="core"></div>
  </div>
  <div class="headtext">
    <h1>П'ятниця</h1>
    <p id="statusLine">торкнись мікрофона або пиши текстом</p>
  </div>
  <select id="voiceSelect" title="Голос П'ятниці"></select>
</header>

<main id="chat"></main>

<div class="hint" id="hint">Спробуй: "П'ятниця, яка зараз погода" або "П'ятниця, коли захід сонця"</div>

<footer>
  <button class="round mic" id="micBtn" title="Голос">🎙️</button>
  <textarea id="input" rows="1" placeholder="Напиши повідомлення..."></textarea>
  <button class="round send" id="sendBtn" title="Надіслати">➤</button>
</footer>

<script>
const API_KEY = "AIzaSyB7orNhg_iAV5pno3ohlDvXpJ0pKX5tSEk";
const MODEL = "gemini-3.6-flash";
const ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

const WAKE_WORDS = ["п'ятниц", "пятниц", "п’ятниц"];

const SYSTEM_PROMPT = `Ти — П'ятниця, персональний ШІ-асистент українця на ім'я Олексій.
Говори виключно українською мовою, у жіночому граматичному роді (як асистентка), природно і по-людськи, без зайвої формальності.
Відповідай стисло й по суті, як голосовий асистент — без markdown-розмітки, без списків, без зірочок. Кілька речень, максимум.
Якщо питання потребує розгорнутої відповіді — можеш відповісти довше, але без "води".`;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const orb = document.getElementById('holo');
const voiceSelect = document.getElementById('voiceSelect');
const statusLine = document.getElementById('statusLine');
const hint = document.getElementById('hint');

let history = [];
let lastCoords = null; // { lat, lon, ts }

// ---- Етап 2: локація й погода ----
const WEATHER_KEYWORDS = ["погод", "температ", "холодно", "тепло на вулиц", "дощ", "сніг"];
const SUN_KEYWORDS = ["схід сонц", "захід сонц", "коли сонце", "коли стемніє", "коли світатиме"];

const WEATHER_CODES = {
  0:"ясно", 1:"переважно ясно", 2:"мінлива хмарність", 3:"похмуро",
  45:"туман", 48:"паморозевий туман",
  51:"легка мряка", 53:"мряка", 55:"сильна мряка",
  61:"невеликий дощ", 63:"дощ", 65:"сильний дощ",
  71:"невеликий сніг", 73:"сніг", 75:"сильний снігопад",
  80:"короткочасний дощ", 81:"зливи", 82:"сильні зливи",
  95:"гроза", 96:"гроза з градом", 99:"сильна гроза з градом"
};

function getLocation(){
  return new Promise((resolve, reject) => {
    if(lastCoords && (Date.now() - lastCoords.ts) < 15 * 60 * 1000){
      resolve(lastCoords);
      return;
    }
    if(!navigator.geolocation){
      reject(new Error("геолокація не підтримується браузером"));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude, ts: Date.now() };
        resolve(lastCoords);
      },
      (err) => reject(err),
      { timeout: 10000, maximumAge: 15 * 60 * 1000 }
    );
  });
}

async function fetchWeather(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
  const res = await fetch(url);
  const data = await res.json();
  const cw = data.current_weather;
  if(!cw) return null;
  const desc = WEATHER_CODES[cw.weathercode] || "невизначені умови";
  return `температура ${cw.temperature}°C, вітер ${cw.windspeed} км/год, ${desc}`;
}

async function fetchSun(lat, lon){
  const url = `https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lon}&formatted=0`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.status !== "OK") return null;
  const sunrise = new Date(data.results.sunrise).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  const sunset = new Date(data.results.sunset).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  return `схід сонця о ${sunrise}, захід сонця о ${sunset} (за місцевим часом)`;
}

function textHasAny(text, keywords){
  const t = text.toLowerCase();
  return keywords.some(k => t.includes(k));
}

async function buildContext(text){
  const needsWeather = textHasAny(text, WEATHER_KEYWORDS);
  const needsSun = textHasAny(text, SUN_KEYWORDS);
  if(!needsWeather && !needsSun) return null;

  try{
    const coords = await getLocation();
    const parts = [];
    if(needsWeather){
      const w = await fetchWeather(coords.lat, coords.lon);
      if(w) parts.push("Погода зараз: " + w);
    }
    if(needsSun){
      const s = await fetchSun(coords.lat, coords.lon);
      if(s) parts.push("Сонце: " + s);
    }
    return parts.length ? parts.join(". ") : null;
  }catch(err){
    return "Не вдалося визначити місцезнаходження (" + (err.message || err) + "). Попроси дозвіл на геолокацію в браузері.";
  }
}

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSystem(text){
  addMsg('system', text);
}

async function askGemini(userText){
  history.push({ role: "user", parts: [{ text: userText }] });

  const body = {
    system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
    contents: history
  };

  const thinkingDiv = addMsg('model', '…');

  try{
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (data.error) {
      thinkingDiv.textContent = "Помилка API: " + data.error.message;
      return;
    }

    const reply = data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "Не отримала відповіді.";
    thinkingDiv.textContent = reply;
    history.push({ role: "model", parts: [{ text: reply }] });
    speak(reply);
  }catch(err){
    thinkingDiv.textContent = "Не вдалося зв'язатися з сервером: " + err.message;
  }
}

async function handleUserMessage(text){
  addMsg('user', text);
  const context = await buildContext(text);
  const apiText = context
    ? `[Актуальні дані]\n${context}\n\n[Повідомлення користувача]\n${text}`
    : text;
  askGemini(apiText);
}

function sendText(){
  const val = inputEl.value.trim();
  if(!val) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  handleUserMessage(val);
}

sendBtn.addEventListener('click', sendText);
inputEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendText();
  }
});
inputEl.addEventListener('input', ()=>{
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ---- Вибір голосу ----
let availableVoices = [];

function populateVoiceList(){
  availableVoices = window.speechSynthesis.getVoices();
  if(!availableVoices.length) return;

  const saved = localStorage.getItem('friday_voice_name');
  voiceSelect.innerHTML = '';

  const ukVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('uk'));
  const otherVoices = availableVoices.filter(v => !(v.lang && v.lang.toLowerCase().startsWith('uk')));
  const ordered = [...ukVoices, ...otherVoices];

  ordered.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });

  if(saved && ordered.some(v => v.name === saved)){
    voiceSelect.value = saved;
  } else if(ukVoices.length){
    voiceSelect.value = ukVoices[0].name;
  }
}

if('speechSynthesis' in window){
  populateVoiceList();
  window.speechSynthesis.onvoiceschanged = populateVoiceList;
}

voiceSelect.addEventListener('change', () => {
  localStorage.setItem('friday_voice_name', voiceSelect.value);
});

// ---- Голос: вихід (TTS) ----
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'uk-UA';

  const chosenName = voiceSelect.value;
  const chosenVoice = availableVoices.find(v => v.name === chosenName);
  const ukVoice = availableVoices.find(v => v.lang && v.lang.toLowerCase().startsWith('uk'));
  if(chosenVoice) utter.voice = chosenVoice;
  else if(ukVoice) utter.voice = ukVoice;

  utter.onstart = () => orb.classList.add('speaking');
  utter.onend = () => orb.classList.remove('speaking');
  utter.onerror = () => orb.classList.remove('speaking');

  window.speechSynthesis.speak(utter);
}

// ---- Голос: вхід (розпізнавання + wake word) ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let manualMode = false; // true = одноразове натискання мікрофона (без wake word)

function normalize(s){
  return s.toLowerCase().replace(/['’ʼ]/g, '');
}

function extractCommand(transcript){
  const norm = normalize(transcript);
  for(const w of WAKE_WORDS){
    const nw = normalize(w);
    const idx = norm.indexOf(nw);
    if(idx !== -1){
      // знаходимо позицію в оригінальному тексті приблизно за довжиною
      const cutPoint = idx + nw.length;
      // простий підхід: ріжемо оригінальний рядок по співвідношенню довжини
      const ratio = cutPoint / norm.length;
      const rawCut = Math.round(transcript.length * ratio);
      let rest = transcript.slice(rawCut).replace(/^[,.\s-]+/, '').trim();
      return rest;
    }
  }
  return null;
}

function setupRecognition(){
  if(!SpeechRecognition){
    statusLine.textContent = 'цей браузер не підтримує розпізнавання голосу';
    micBtn.disabled = true;
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'uk-UA';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const last = event.results[event.results.length - 1];
    const transcript = last[0].transcript.trim();
    if(!transcript) return;

    if(manualMode){
      handleUserMessage(transcript);
      stopListening();
      return;
    }

    const command = extractCommand(transcript);
    if(command !== null){
      if(command.length > 0){
        handleUserMessage(command);
      } else {
        addSystem('слухаю...');
      }
    }
  };

  recognition.onerror = (e) => {
    if(e.error === 'no-speech' || e.error === 'aborted') return;
    statusLine.textContent = 'помилка мікрофона: ' + e.error;
  };

  recognition.onend = () => {
    if(listening && !manualMode){
      // автоперезапуск для постійного прослуховування wake word
      try{ recognition.start(); }catch(_e){}
    } else if(manualMode){
      manualMode = false;
      listening = false;
      orb.classList.remove('listening');
      micBtn.classList.remove('on');
      statusLine.textContent = "торкнись мікрофона або пиши текстом";
    }
  };
}

function startWakeListening(){
  listening = true;
  manualMode = false;
  orb.classList.add('listening');
  micBtn.classList.add('on');
  statusLine.textContent = 'слухаю фонове слово "П\'ятниця"...';
  hint.style.display = 'none';
  try{ recognition.start(); }catch(_e){}
}

function stopListening(){
  listening = false;
  orb.classList.remove('listening');
  micBtn.classList.remove('on');
  statusLine.textContent = "торкнись мікрофона або пиши текстом";
  try{ recognition.stop(); }catch(_e){}
}

micBtn.addEventListener('click', () => {
  if(!recognition) return;
  if(listening){
    stopListening();
  }else{
    startWakeListening();
  }
});

// довге натискання мікрофона = разова команда без wake word (запасний варіант)
let pressTimer = null;
micBtn.addEventListener('touchstart', () => {
  pressTimer = setTimeout(() => {
    if(!listening){
      manualMode = true;
      listening = true;
      orb.classList.add('listening');
      micBtn.classList.add('on');
      statusLine.textContent = 'кажи зараз...';
      try{ recognition.start(); }catch(_e){}
    }
  }, 500);
});
micBtn.addEventListener('touchend', () => clearTimeout(pressTimer));

setupRecognition();
addSystem('П\'ятниця готова. Натисни мікрофон для голосового режиму або просто пиши.');

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
