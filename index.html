<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>П'ятниця</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1119">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="П'ятниця">
<style>
  :root{
    --bg: #0d1119;
    --panel: #151b2b;
    --panel-2: #1c2338;
    --line: #262d42;
    --text: #eef0f7;
    --muted: #8890a8;
    --accent: #e3a94c;
    --accent-dim: #6b5527;
    --user-bubble: #232a40;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #1a2036 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  header{
    padding:22px 20px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .holo{
    width:52px;height:52px;
    position:relative;
    flex-shrink:0;
  }
  .holo .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid var(--accent-dim);
  }
  .holo .ring-outer{
    border-style:dashed;
    opacity:.55;
    animation:spin 7s linear infinite;
  }
  .holo .ring-mid{
    inset:9px;
    border-color:var(--accent);
    opacity:.4;
    animation:spin 4.5s linear infinite reverse;
  }
  .holo .core{
    position:absolute;
    inset:17px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f6d18a, var(--accent) 55%, var(--accent-dim) 100%);
    box-shadow:0 0 0 0 rgba(227,169,76,.5);
    transition:box-shadow .3s ease;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulseCore{
    0%{box-shadow:0 0 0 0 rgba(227,169,76,.5);}
    70%{box-shadow:0 0 0 15px rgba(227,169,76,0);}
    100%{box-shadow:0 0 0 0 rgba(227,169,76,0);}
  }
  .holo.listening .core{ animation:pulseCore 1.4s infinite; }
  .holo.speaking .core{ animation:pulseCore 0.55s infinite; }
  .holo.speaking .ring-outer{ animation-duration:2s; border-color:var(--accent); opacity:.8; }
  .holo.speaking .ring-mid{ animation-duration:1.1s; opacity:.7; }
  header h1{
    font-size:19px;
    font-weight:600;
    letter-spacing:.2px;
    margin:0;
  }
  header p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--muted);
  }
  header .headtext{ flex:1; min-width:0; }
  #voiceSelect{
    background:var(--panel);
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:12px;
    padding:6px 8px;
    max-width:112px;
    flex-shrink:0;
  }

  main{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:16px;
    font-size:15px;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .msg.model{
    background:var(--panel);
    border:1px solid var(--line);
    align-self:flex-start;
    border-bottom-left-radius:4px;
  }
  .msg.user{
    background:var(--user-bubble);
    align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  .msg.system{
    align-self:center;
    color:var(--muted);
    font-size:12.5px;
    background:none;
    padding:2px 8px;
  }

  footer{
    padding:12px 14px;
    border-top:1px solid var(--line);
    display:flex;
    gap:8px;
    align-items:flex-end;
    flex-shrink:0;
    background:var(--bg);
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:14px;
    padding:11px 14px;
    font-size:15px;
    font-family:inherit;
    max-height:120px;
    line-height:1.4;
  }
  textarea:focus{outline:none;border-color:var(--accent-dim);}

  button.round{
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:18px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  button.round.mic.on{
    background:var(--accent);
    color:#1a1206;
    border-color:var(--accent);
  }
  button.round.send{
    background:var(--accent);
    color:#1a1206;
    border-color:var(--accent);
  }
  button.round:active{transform:scale(0.94);}

  .hint{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:6px 20px 0;
  }

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .menu-btn{
    font-size:18px;
    background:transparent;
  }

  .sidebar-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:40;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .sidebar-overlay.open{
    opacity:1;
    pointer-events:auto;
  }

  .sidebar{
    position:fixed;
    top:0; bottom:0; left:0;
    width:82%;
    max-width:320px;
    background:var(--panel);
    border-right:1px solid var(--line);
    z-index:50;
    transform:translateX(-100%);
    transition:transform .25s ease;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  .sidebar.open{ transform:translateX(0); }

  .sidebar-section{
    padding:16px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-section h3{
    margin:0 0 8px;
    font-size:13px;
    color:var(--muted);
    text-transform:none;
  }
  .sidebar-hint{
    font-size:11.5px;
    color:var(--muted);
    margin:0 0 10px;
    line-height:1.4;
  }

  .new-chat-btn{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:1px solid var(--accent-dim);
    background:var(--panel-2);
    color:var(--accent);
    font-size:14px;
    margin-bottom:10px;
  }

  .chat-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 8px;
    border-radius:10px;
    font-size:13.5px;
    margin-bottom:4px;
  }
  .chat-item.active{ background:var(--panel-2); }
  .chat-item .chat-title{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .chat-item .chat-del{
    color:var(--muted);
    font-size:15px;
    padding:2px 6px;
  }

  .memory-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:8px;
    border-radius:10px;
    background:var(--panel-2);
    font-size:13px;
    margin-bottom:6px;
    line-height:1.4;
  }
  .memory-item .memory-text{ flex:1; }
  .memory-item .memory-del{
    color:var(--muted);
    font-size:15px;
    flex-shrink:0;
  }
  .memory-empty{
    color:var(--muted);
    font-size:12.5px;
    font-style:italic;
  }

  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:14px;
    cursor:pointer;
  }
  .toggle-row input{ display:none; }
  .toggle-track{
    width:42px; height:24px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:99px;
    position:relative;
    flex-shrink:0;
    transition:background .2s ease;
  }
  .toggle-thumb{
    position:absolute;
    top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--muted);
    transition:transform .2s ease, background .2s ease;
  }
  .toggle-row input:checked + .toggle-track{ background:var(--accent-dim); }
  .toggle-row input:checked + .toggle-track .toggle-thumb{
    transform:translateX(18px);
    background:var(--accent);
  }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
  }
  .gallery-item{
    position:relative;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    background:var(--panel-2);
  }
  .gallery-item img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .gallery-item .gallery-del{
    position:absolute;
    top:2px; right:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:#fff;
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
  }

  .msg-image{
    max-width:100%;
    border-radius:12px;
    display:block;
    margin-top:6px;
  }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:60;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:8px;
  }
  .lightbox-close{
    position:absolute;
    top:env(safe-area-inset-top,16px);
    right:16px;
    width:36px; height:36px;
    border-radius:50%;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--line);
    font-size:16px;
  }
</style>
</head>
<body>

<header>
  <button class="round menu-btn" id="menuBtn" title="Чати та пам'ять">☰</button>
  <div class="holo" id="holo">
    <div class="ring ring-outer"></div>
    <div class="ring ring-mid"></div>
    <div class="core"></div>
  </div>
  <div class="headtext">
    <h1>П'ятниця</h1>
    <p id="statusLine">торкнись мікрофона або пиши текстом</p>
  </div>
  <select id="voiceSelect" title="Голос П'ятниці"></select>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-section">
    <button class="new-chat-btn" id="newChatBtn">+ Новий чат</button>
    <div id="chatList"></div>
  </div>
  <div class="sidebar-section">
    <h3>Режим спілкування</h3>
    <label class="toggle-row">
      <span>💕 Режим флірту</span>
      <input type="checkbox" id="flirtToggle">
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
    </label>
  </div>
  <div class="sidebar-section">
    <h3>Пам'ять</h3>
    <p class="sidebar-hint">Скажи "П'ятниця, запам'ятай ..." — і це діятиме в усіх чатах</p>
    <div id="memoryList"></div>
  </div>
  <div class="sidebar-section">
    <h3>Галерея</h3>
    <p class="sidebar-hint">Скажи "П'ятниця, намалюй ..." — зображення збережуться тут</p>
    <div id="galleryGrid" class="gallery-grid"></div>
  </div>
</aside>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<main id="chat"></main>

<div class="hint" id="hint">Спробуй: "П'ятниця, яка зараз погода" або "П'ятниця, коли захід сонця"</div>

<footer>
  <button class="round mic" id="micBtn" title="Голос">🎙️</button>
  <textarea id="input" rows="1" placeholder="Напиши повідомлення..."></textarea>
  <button class="round send" id="sendBtn" title="Надіслати">➤</button>
</footer>

<script>
const ENDPOINT = "https://pyatnytsia-proxy-bc33.kaminskijoleksij2.workers.dev";

const WAKE_WORDS = ["п'ятниц", "пятниц", "п’ятниц"];

const SYSTEM_PROMPT_BASE = `Ти — П'ятниця, персональний ШІ-асистент українця на ім'я Олексій.
Говори виключно українською мовою, у жіночому граматичному роді (як асистентка), природно і по-людськи, без зайвої формальності.
Відповідай стисло й по суті, як голосовий асистент — без markdown-розмітки, без списків, без зірочок. Кілька речень, максимум.
Якщо питання потребує розгорнутої відповіді — можеш відповісти довше, але без "води".
Якщо користувач просить щось запам'ятати ("запам'ятай...") — коротко підтверди, що зберегла це, природною фразою.
Ти вмієш генерувати зображення: якщо просять намалювати/згенерувати щось — це вже обробляється окремо технічно, тобі не потрібно відмовляти чи казати, що не вмієш малювати.`;

const SYSTEM_PROMPT_FLIRT = `Зараз увімкнено режим флірту. У цьому режимі ти поводишся як приваблива, впевнена в собі й грайлива співрозмовниця: відверто фліртуєш, робиш сміливі компліменти, трохи дражниш і підколюєш, тримаєш легку інтригу й тепле романтичне напруження в розмові. Використовуй ніжні звертання, грайливий тон, легку іронію.
При цьому це романтичний флірт і кокетство, а не сексуальний контент: без відвертих описів статевої активності чи оголеного тіла. Якщо розмова тягнеться в бік явно сексуального — м'яко переведи в грайливий, але пристойний тон.`;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const orb = document.getElementById('holo');
const voiceSelect = document.getElementById('voiceSelect');
const statusLine = document.getElementById('statusLine');
const hint = document.getElementById('hint');
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const newChatBtn = document.getElementById('newChatBtn');
const chatListEl = document.getElementById('chatList');
const memoryListEl = document.getElementById('memoryList');
const flirtToggle = document.getElementById('flirtToggle');
const galleryGrid = document.getElementById('galleryGrid');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

let history = [];
let lastCoords = null; // { lat, lon, ts }
let activeChatId = null;

// ---- Локальне сховище: чати ----
function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(_e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(_e){}
}

function getChats(){ return loadJSON('friday_chats', []); }
function saveChats(chats){ saveJSON('friday_chats', chats); }

function getChatHistory(id){ return loadJSON('friday_chat_' + id, []); }
function saveChatHistory(id, hist){ saveJSON('friday_chat_' + id, hist); }

function createChat(){
  const id = 'c' + Date.now();
  const chats = getChats();
  chats.unshift({ id, title: 'Новий чат' });
  saveChats(chats);
  saveChatHistory(id, []);
  return id;
}

function deleteChat(id){
  let chats = getChats().filter(c => c.id !== id);
  localStorage.removeItem('friday_chat_' + id);
  saveChats(chats);
  if(activeChatId === id){
    if(chats.length){
      switchChat(chats[0].id);
    }else{
      switchChat(createChat());
    }
  }else{
    renderChatList();
  }
}

function renameChat(id, title){
  const chats = getChats();
  const chat = chats.find(c => c.id === id);
  if(chat){
    chat.title = title.slice(0, 40);
    saveChats(chats);
  }
}

function switchChat(id){
  activeChatId = id;
  saveJSON('friday_active_chat', id);
  history = getChatHistory(id);
  renderChatFromHistory();
  renderChatList();
  closeSidebar();
}

function renderChatFromHistory(){
  chatEl.innerHTML = '';
  if(history.length === 0){
    addSystem('П\'ятниця готова. Натисни мікрофон для голосового режиму або просто пиши.');
    return;
  }
  history.forEach(turn => {
    const text = (turn.parts || []).map(p => p.text || '').join('');
    addMsg(turn.role === 'user' ? 'user' : 'model', text);
  });
}

function renderChatList(){
  const chats = getChats();
  chatListEl.innerHTML = '';
  chats.forEach(c => {
    const row = document.createElement('div');
    row.className = 'chat-item' + (c.id === activeChatId ? ' active' : '');
    const title = document.createElement('div');
    title.className = 'chat-title';
    title.textContent = c.title || 'Чат';
    title.addEventListener('click', () => switchChat(c.id));
    const del = document.createElement('div');
    del.className = 'chat-del';
    del.textContent = '✕';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteChat(c.id);
    });
    row.appendChild(title);
    row.appendChild(del);
    chatListEl.appendChild(row);
  });
}

function initChats(){
  let chats = getChats();
  if(chats.length === 0){
    const id = createChat();
    chats = getChats();
    activeChatId = id;
  }else{
    activeChatId = loadJSON('friday_active_chat', chats[0].id);
    if(!chats.some(c => c.id === activeChatId)) activeChatId = chats[0].id;
  }
  history = getChatHistory(activeChatId);
  renderChatFromHistory();
  renderChatList();
}

function persistCurrentChat(){
  saveChatHistory(activeChatId, history);
  const chats = getChats();
  const chat = chats.find(c => c.id === activeChatId);
  if(chat && chat.title === 'Новий чат'){
    const firstUserTurn = history.find(t => t.role === 'user');
    if(firstUserTurn){
      const text = (firstUserTurn.parts || []).map(p => p.text || '').join('');
      renameChat(activeChatId, text);
      renderChatList();
    }
  }
}

// ---- Постійна пам'ять (діє в усіх чатах) ----
function getMemory(){ return loadJSON('friday_memory', []); }
function saveMemory(list){ saveJSON('friday_memory', list); }

function addMemory(fact){
  const list = getMemory();
  list.push(fact.trim());
  saveMemory(list);
  renderMemoryList();
}

function removeMemory(index){
  const list = getMemory();
  list.splice(index, 1);
  saveMemory(list);
  renderMemoryList();
}

function renderMemoryList(){
  const list = getMemory();
  memoryListEl.innerHTML = '';
  if(list.length === 0){
    const empty = document.createElement('div');
    empty.className = 'memory-empty';
    empty.textContent = 'Поки нічого не збережено';
    memoryListEl.appendChild(empty);
    return;
  }
  list.forEach((fact, i) => {
    const row = document.createElement('div');
    row.className = 'memory-item';
    const text = document.createElement('div');
    text.className = 'memory-text';
    text.textContent = fact;
    const del = document.createElement('div');
    del.className = 'memory-del';
    del.textContent = '✕';
    del.addEventListener('click', () => removeMemory(i));
    row.appendChild(text);
    row.appendChild(del);
    memoryListEl.appendChild(row);
  });
}

function buildSystemPrompt(){
  let prompt = SYSTEM_PROMPT_BASE;
  if(getFlirtMode()){
    prompt += "\n\n" + SYSTEM_PROMPT_FLIRT;
  }
  const memory = getMemory();
  if(memory.length){
    const memoryBlock = memory.map(f => '- ' + f).join('\n');
    prompt += `\n\nОсь що ти вже знаєш про Олексія з попередніх розмов (враховуй це природно, не перераховуй список вголос):\n${memoryBlock}`;
  }
  return prompt;
}

function getFlirtMode(){ return loadJSON('friday_flirt_mode', false); }
function setFlirtMode(val){ saveJSON('friday_flirt_mode', val); }

flirtToggle.checked = getFlirtMode();
flirtToggle.addEventListener('change', () => setFlirtMode(flirtToggle.checked));

function extractRememberRequest(text){
  const match = text.match(/запам['’ʼ]?ятай(?:,)?\s+(.+)/i);
  return match ? match[1].trim() : null;
}

function extractImageRequest(text){
  const match = text.match(/(?:намалюй|створи|згенеруй)\s+(?:мені\s+)?(?:зображення|картинку|фото)?\s*[:,]?\s*(.+)/i);
  return match ? match[1].trim() : null;
}

// ---- Галерея зображень (IndexedDB) ----
const GALLERY_DB = 'friday_gallery_db';
const GALLERY_STORE = 'images';

function openGalleryDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(GALLERY_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(GALLERY_STORE)){
        db.createObjectStore(GALLERY_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveImageToGallery(dataUrl, prompt){
  try{
    const db = await openGalleryDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(GALLERY_STORE, 'readwrite');
      tx.objectStore(GALLERY_STORE).put({ id: 'img' + Date.now(), dataUrl, prompt, ts: Date.now() });
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    renderGallery();
  }catch(_e){}
}

async function getGalleryImages(){
  try{
    const db = await openGalleryDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(GALLERY_STORE, 'readonly');
      const req = tx.objectStore(GALLERY_STORE).getAll();
      req.onsuccess = () => resolve(req.result.sort((a,b) => b.ts - a.ts));
      req.onerror = () => reject(req.error);
    });
  }catch(_e){ return []; }
}

async function deleteGalleryImage(id){
  try{
    const db = await openGalleryDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(GALLERY_STORE, 'readwrite');
      tx.objectStore(GALLERY_STORE).delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    renderGallery();
  }catch(_e){}
}

async function renderGallery(){
  const images = await getGalleryImages();
  galleryGrid.innerHTML = '';
  if(images.length === 0){
    const empty = document.createElement('div');
    empty.className = 'memory-empty';
    empty.textContent = 'Поки порожньо';
    galleryGrid.appendChild(empty);
    return;
  }
  images.forEach(img => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    const thumb = document.createElement('img');
    thumb.src = img.dataUrl;
    thumb.addEventListener('click', () => openLightbox(img.dataUrl));
    const del = document.createElement('div');
    del.className = 'gallery-del';
    del.textContent = '✕';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteGalleryImage(img.id);
    });
    item.appendChild(thumb);
    item.appendChild(del);
    galleryGrid.appendChild(item);
  });
}

async function generateImage(prompt){
  const thinkingDiv = addMsg('model', 'Малюю...');
  try{
    const seed = Math.floor(Math.random() * 1000000);
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=768&nologo=true&seed=${seed}`;

    const res = await fetch(url);
    if(!res.ok) throw new Error("сервер зображень повернув помилку " + res.status);

    const blob = await res.blob();
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(blob);
    });

    thinkingDiv.remove();
    addImageMsg(dataUrl, "Ось що вийшло:");
    saveImageToGallery(dataUrl, prompt);
    history.push({ role: "user", parts: [{ text: "Намалюй: " + prompt }] });
    history.push({ role: "model", parts: [{ text: "Згенерувала зображення за твоїм описом." }] });
    persistCurrentChat();
  }catch(err){
    thinkingDiv.textContent = "Не вдалося згенерувати зображення: " + err.message;
  }
}

// ---- Етап 2: локація й погода ----
const WEATHER_KEYWORDS = ["погод", "температ", "холодно", "тепло на вулиц", "дощ", "сніг"];
const SUN_KEYWORDS = ["схід сонц", "захід сонц", "коли сонце", "коли стемніє", "коли світатиме"];

const WEATHER_CODES = {
  0:"ясно", 1:"переважно ясно", 2:"мінлива хмарність", 3:"похмуро",
  45:"туман", 48:"паморозевий туман",
  51:"легка мряка", 53:"мряка", 55:"сильна мряка",
  61:"невеликий дощ", 63:"дощ", 65:"сильний дощ",
  71:"невеликий сніг", 73:"сніг", 75:"сильний снігопад",
  80:"короткочасний дощ", 81:"зливи", 82:"сильні зливи",
  95:"гроза", 96:"гроза з градом", 99:"сильна гроза з градом"
};

function getLocation(){
  return new Promise((resolve, reject) => {
    if(lastCoords && (Date.now() - lastCoords.ts) < 15 * 60 * 1000){
      resolve(lastCoords);
      return;
    }
    if(!navigator.geolocation){
      reject(new Error("геолокація не підтримується браузером"));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude, ts: Date.now() };
        resolve(lastCoords);
      },
      (err) => reject(err),
      { timeout: 10000, maximumAge: 15 * 60 * 1000 }
    );
  });
}

async function fetchWeather(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
  const res = await fetch(url);
  const data = await res.json();
  const cw = data.current_weather;
  if(!cw) return null;
  const desc = WEATHER_CODES[cw.weathercode] || "невизначені умови";
  return `температура ${cw.temperature}°C, вітер ${cw.windspeed} км/год, ${desc}`;
}

async function fetchSun(lat, lon){
  const url = `https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lon}&formatted=0`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.status !== "OK") return null;
  const sunrise = new Date(data.results.sunrise).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  const sunset = new Date(data.results.sunset).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  return `схід сонця о ${sunrise}, захід сонця о ${sunset} (за місцевим часом)`;
}

function textHasAny(text, keywords){
  const t = text.toLowerCase();
  return keywords.some(k => t.includes(k));
}

async function buildContext(text){
  const needsWeather = textHasAny(text, WEATHER_KEYWORDS);
  const needsSun = textHasAny(text, SUN_KEYWORDS);
  if(!needsWeather && !needsSun) return null;

  try{
    const coords = await getLocation();
    const parts = [];
    if(needsWeather){
      const w = await fetchWeather(coords.lat, coords.lon);
      if(w) parts.push("Погода зараз: " + w);
    }
    if(needsSun){
      const s = await fetchSun(coords.lat, coords.lon);
      if(s) parts.push("Сонце: " + s);
    }
    return parts.length ? parts.join(". ") : null;
  }catch(err){
    return "Не вдалося визначити місцезнаходження (" + (err.message || err) + "). Попроси дозвіл на геолокацію в браузері.";
  }
}

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSystem(text){
  addMsg('system', text);
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

function isRetryableError(message){
  return /high demand|overloaded|unavailable|503|internal error|deadline|quota|rate limit|429/i.test(message || "");
}

function extractRetryDelayMs(message){
  const match = (message || "").match(/retry in\s+([\d.]+)s/i);
  return match ? Math.ceil(parseFloat(match[1]) * 1000) + 500 : null;
}

async function askGemini(userText){
  history.push({ role: "user", parts: [{ text: userText }] });
  persistCurrentChat();

  const body = {
    system_instruction: { parts: [{ text: buildSystemPrompt() }] },
    contents: history
  };

  const thinkingDiv = addMsg('model', '…');
  const maxAttempts = 3;

  for(let attempt = 1; attempt <= maxAttempts; attempt++){
    try{
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (data.error) {
        if(isRetryableError(data.error.message) && attempt < maxAttempts){
          const suggestedDelay = extractRetryDelayMs(data.error.message);
          const delay = suggestedDelay || (1200 * attempt);
          const secs = Math.ceil(delay / 1000);
          thinkingDiv.textContent = `Ліміт запитів, чекаю ${secs} с і пробую ще раз... (${attempt}/${maxAttempts})`;
          await sleep(delay);
          continue;
        }
        thinkingDiv.textContent = "Помилка API: " + data.error.message;
        return;
      }

      const reply = data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "Не отримала відповіді.";
      thinkingDiv.textContent = reply;
      history.push({ role: "model", parts: [{ text: reply }] });
      persistCurrentChat();
      speak(reply);
      return;
    }catch(err){
      if(attempt < maxAttempts){
        thinkingDiv.textContent = `Проблема зі з'єднанням, пробую ще раз... (${attempt}/${maxAttempts})`;
        await sleep(1200 * attempt);
        continue;
      }
      thinkingDiv.textContent = "Не вдалося зв'язатися з сервером: " + err.message;
      return;
    }
  }
}

async function handleUserMessage(text){
  addMsg('user', text);

  const imagePrompt = extractImageRequest(text);
  if(imagePrompt){
    generateImage(imagePrompt);
    return;
  }

  const rememberFact = extractRememberRequest(text);
  if(rememberFact){
    addMemory(rememberFact);
  }

  const context = await buildContext(text);
  const apiText = context
    ? `[Актуальні дані]\n${context}\n\n[Повідомлення користувача]\n${text}`
    : text;
  askGemini(apiText);
}

// ---- Вибір голосу ----
let availableVoices = [];

function populateVoiceList(){
  availableVoices = window.speechSynthesis.getVoices();
  if(!availableVoices.length) return;

  const saved = localStorage.getItem('friday_voice_name');
  voiceSelect.innerHTML = '';

  const ukVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('uk'));
  const otherVoices = availableVoices.filter(v => !(v.lang && v.lang.toLowerCase().startsWith('uk')));
  const ordered = [...ukVoices, ...otherVoices];

  ordered.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });

  if(saved && ordered.some(v => v.name === saved)){
    voiceSelect.value = saved;
  } else if(ukVoices.length){
    voiceSelect.value = ukVoices[0].name;
  }
}

if('speechSynthesis' in window){
  populateVoiceList();
  window.speechSynthesis.onvoiceschanged = populateVoiceList;
}

voiceSelect.addEventListener('change', () => {
  localStorage.setItem('friday_voice_name', voiceSelect.value);
});

// ---- Голос: вихід (TTS) ----
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'uk-UA';

  const chosenName = voiceSelect.value;
  const chosenVoice = availableVoices.find(v => v.name === chosenName);
  const ukVoice = availableVoices.find(v => v.lang && v.lang.toLowerCase().startsWith('uk'));
  if(chosenVoice) utter.voice = chosenVoice;
  else if(ukVoice) utter.voice = ukVoice;

  utter.onstart = () => orb.classList.add('speaking');
  utter.onend = () => orb.classList.remove('speaking');
  utter.onerror = () => orb.classList.remove('speaking');

  window.speechSynthesis.speak(utter);
}

// ---- Голос: вхід (розпізнавання + wake word) ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let manualMode = false; // true = одноразове натискання мікрофона (без wake word)

function normalize(s){
  return s.toLowerCase().replace(/['’ʼ]/g, '');
}

function extractCommand(transcript){
  const norm = normalize(transcript);
  for(const w of WAKE_WORDS){
    const nw = normalize(w);
    const idx = norm.indexOf(nw);
    if(idx !== -1){
      // знаходимо позицію в оригінальному тексті приблизно за довжиною
      const cutPoint = idx + nw.length;
      // простий підхід: ріжемо оригінальний рядок по співвідношенню довжини
      const ratio = cutPoint / norm.length;
      const rawCut = Math.round(transcript.length * ratio);
      let rest = transcript.slice(rawCut).replace(/^[,.\s-]+/, '').trim();
      return rest;
    }
  }
  return null;
}

function setupRecognition(){
  if(!SpeechRecognition){
    statusLine.textContent = 'цей браузер не підтримує розпізнавання голосу';
    micBtn.disabled = true;
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'uk-UA';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const last = event.results[event.results.length - 1];
    const transcript = last[0].transcript.trim();
    if(!transcript) return;

    if(manualMode){
      handleUserMessage(transcript);
      stopListening();
      return;
    }

    const command = extractCommand(transcript);
    if(command !== null){
      if(command.length > 0){
        handleUserMessage(command);
      } else {
        addSystem('слухаю...');
      }
    }
  };

  recognition.onerror = (e) => {
    if(e.error === 'no-speech' || e.error === 'aborted') return;
    statusLine.textContent = 'помилка мікрофона: ' + e.error;
  };

  recognition.onend = () => {
    if(listening && !manualMode){
      // автоперезапуск для постійного прослуховування wake word
      try{ recognition.start(); }catch(_e){}
    } else if(manualMode){
      manualMode = false;
      listening = false;
      orb.classList.remove('listening');
      micBtn.classList.remove('on');
      statusLine.textContent = "торкнись мікрофона або пиши текстом";
    }
  };
}

function startWakeListening(){
  listening = true;
  manualMode = false;
  orb.classList.add('listening');
  micBtn.classList.add('on');
  statusLine.textContent = 'слухаю фонове слово "П\'ятниця"...';
  hint.style.display = 'none';
  try{ recognition.start(); }catch(_e){}
}

function stopListening(){
  listening = false;
  orb.classList.remove('listening');
  micBtn.classList.remove('on');
  statusLine.textContent = "торкнись мікрофона або пиши текстом";
  try{ recognition.stop(); }catch(_e){}
}

micBtn.addEventListener('click', () => {
  if(!recognition) return;
  if(listening){
    stopListening();
  }else{
    startWakeListening();
  }
});

// довге натискання мікрофона = разова команда без wake word (запасний варіант)
let pressTimer = null;
micBtn.addEventListener('touchstart', () => {
  pressTimer = setTimeout(() => {
    if(!listening){
      manualMode = true;
      listening = true;
      orb.classList.add('listening');
      micBtn.classList.add('on');
      statusLine.textContent = 'кажи зараз...';
      try{ recognition.start(); }catch(_e){}
    }
  }, 500);
});
micBtn.addEventListener('touchend', () => clearTimeout(pressTimer));

setupRecognition();
initChats();
renderMemoryList();
renderGallery();
